<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>English Around You · 场景英语对话库</title>
<meta name="description" content="按场景整理的地道英语对话：你一言我一语，英文+中文对照，点击即读。离线可用，无需登录。">
<meta name="theme-color" content="#5b6cff">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="view">

  <!-- 顶部：品牌 + 搜索 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🌍</span>
      <div>
        <div class="brand-name">English Around You</div>
        <div class="brand-sub">场景对话 · 点一句读一句</div>
      </div>
    </div>
  </header>

  <div class="search-row">
    <input id="search" class="search-input" type="search" autocomplete="off"
           placeholder="🔍 搜句子，如：谢谢 / hospital / 迟到">
    <button id="search-clear" class="icon-btn" title="清空" hidden>✕</button>
  </div>

  <!-- 分类条（横向滚动） -->
  <div id="cat-bar" class="cat-bar"></div>

  <!-- 主内容区（JS 渲染） -->
  <main id="main" class="main"></main>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button data-tab="home" class="tab active"><span>🏠</span><i>场景</i></button>
    <button data-tab="favs" class="tab"><span>⭐</span><i>收藏</i></button>
    <button data-tab="set" class="tab"><span>⚙️</span><i>设置</i></button>
  </nav>

</div>

<script src="data.js"></script>
<script src="data-levels.js"></script>
<script src="app.js"></script>
</body>
</html>
